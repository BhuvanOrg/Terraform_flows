name: Orchestration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Choose the environment
        type: choice
        required: true
        options:
          - tst
          - acc
          - prd

jobs:
  approval-gate:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    outputs:
      subscription_id: ${{ steps.vars.outputs.subscription_id }}
    steps:
      - name: Export environment variables
        id: vars
        run: |
          echo "subscription_id=${{ vars.NAME }}" >> "$GITHUB_OUTPUT"

      - name: Deployment approved
        run: echo "Deployment approved"

  stop-service:
    needs: approval-gate
    uses: ./.github/workflows/controlm-stop.yml
    with:
      environment: ${{ github.event.inputs.environment }}

  apply-patching:
    needs: [approval-gate, stop-service]
    uses: ./.github/workflows/patching.yml
    with:
      environment: ${{ github.event.inputs.environment }}

  start-service:
    needs: [approval-gate, apply-patching]
    uses: ./.github/workflows/controlm-start.yml
    with:
      environment: ${{ github.event.inputs.environment }}
