name: Orchestration
on:
  workflow_dispatch:
    inputs:
      environment: 
        description: choose the envrionemt
        type: choice
        required: true
        options:
          - tst
          - acc
          - prd
    

jobs:
  stop-service:
    uses: ./.github/workflows/controlm-stop.yml
    with:
      environment: ${{ inputs.environment }}


  Apply-Patching:
    needs: stop-service
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Greeter
        run: echo "Hi Welcome"

      - name: show vars
        run: echo "${{ vars.NAME }}"

  start-service:
    needs: Apply-Patching
    runs-on: ubuntu-latest
    environment: ${{ needs.Apply-Patching.environment }}
    steps:
      - name: start
        run: echo "starting all services"
      