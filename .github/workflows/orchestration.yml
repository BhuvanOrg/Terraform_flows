name: Orchestration
on:
  workflow_dispatch:
    inputs:
      environment: 
        description: choose the envrionemt
        type: choice
        required: true
        options:
          - tst
          - acc
          - prd
    

jobs:
  stop-service:
    uses: ./.github/workflows/controlm-stop.yml
    with:
      environment: ${{ inputs.environment }}


  Apply-Patching:
    needs: stop-service
    uses: ./.github/workflows/patching.yml
    with:
      environment: ${{ inputs.environment }}

  start-service:
    needs: Apply-Patching
    uses: ./.github/workflows/controlm-start.yml
    with:
      environment: ${{ inputs.environment }}
      